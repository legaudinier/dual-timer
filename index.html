<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Dual Timer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #241c3a;
      --fg: #ece8f7;
      --surface: #2f2550;
      --surface-alt: #3a2f61;
      --border: #4a3d78;
      --hover: #403471;
      --muted: #b3a8d4;
      --active-border: #a78bfa;
      --active-bg: #3d2f6b;
      --shimmer: rgba(167, 139, 250, .55);
    }

    [data-theme="dark"] {
      --bg: #f5f6f8;
      --fg: #1f2328;
      --surface: #fff;
      --surface-alt: #eceff3;
      --border: #d5d9e0;
      --hover: #eef1f5;
      --muted: #6b7280;
      --active-border: #2e9e4f;
      --active-bg: #eaf7ee;
      --shimmer: rgba(46, 158, 79, .45);
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      background: var(--bg);
      color: var(--fg);
    }

    h1 {
      font-size: 20px;
    }

    #themeBtn {
      height: 80px;
      display: block;
      margin-left: auto;
      margin-bottom: 20px;
      font-size: 40px;
    }

    .timers {
      display: flex;
      gap: 20px;
      font-size: 45px;
    }

    .timer {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 16px;
      text-align: center;
      height: 500px;
    }

    .timer.active {
      border-color: var(--active-border);
      background: var(--active-bg);
    }

    #leftBox,
    #rightBox {
      position: relative;
    }

    #leftBtn,
    #rightBtn {
      width: 100%;
      background-color: transparent;
      border-radius: 0;
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      color: transparent;
    }

    .clock {
      font-size: 70px;
      font-variant-numeric: tabular-nums;
      margin: 175px 0;
    }

    button {
      font-size: 15px;
      padding: 8px 16px;
      cursor: pointer;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    button:hover:not(:disabled) {
      background: var(--hover);
    }

    #sessionSection,
    #sessionInfo {
      font-size: 40px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    select {
      font-size: 15px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .bar {
      margin: 16px 0;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    #saveBtn,
    #resetBtn,
    #exportCsvBtn {
      width: 100%;
      height: 100px;
      margin-bottom: 30px;
      font-size: 40px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      background: var(--surface);
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

    th {
      background: var(--surface-alt);
    }

    tbody button {
      padding: 4px 12px;
      font-size: 13px;
    }

    tr.daygroup td {
      background: var(--surface-alt);
      font-weight: 600;
    }

    h2.collapser {
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }

    #caret {
      display: inline-block;
      width: 1em;
      font-size: 12px;
    }

    #caret.closed {
      transform: rotate(-90deg);
    }

    button.shimmer {
      background-image: linear-gradient(100deg, transparent 30%, var(--shimmer) 50%, transparent 70%);
      background-size: 300% 100%;
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
      from {
        background-position: 150% 0;
      }

      to {
        background-position: -150% 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button.shimmer {
        animation: none;
        border-color: var(--active-border);
      }
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="head">
    <button id="themeBtn">Dark mode</button>
  </div>

  <div class="bar" style="display:none">
    <strong>User:</strong>
    <select id="userSel"></select>
    <button id="addUserBtn">Add User</button>
    <button id="renameUserBtn">Rename</button>
    <button id="delUserBtn">Delete User</button>
  </div>

  <div class="timers">
    <div class="timer" id="leftBox">
      <div>LEFT</div>
      <div class="clock" id="leftClock">00:00:00.0</div>
      <button id="leftBtn">Start</button>
    </div>
    <div class="timer" id="rightBox">
      <div>RIGHT</div>
      <div class="clock" id="rightClock">00:00:00.0</div>
      <button id="rightBtn">Start</button>
    </div>
  </div>

  <div class="bar">
    <div id="sessionSection">
      <strong>Session:</strong>
      <span id="sessionInfo" class="muted">not started</span>
    </div>
    <button id="saveBtn">Save Session</button>
    <!-- <button id="exportBtn">Export JSON</button> -->
    <button id="exportCsvBtn">Export CSV</button>
    <button id="resetBtn">Reset Current</button>

  </div>

  <h2 id="sessionsToggle" class="collapser">
    <span id="caret">▼</span>
    Saved Sessions <span id="userLabel" style="display:none"></span>(<span id="count">0</span>)
  </h2>
  <table id="tbl">
    <thead>
      <tr>
        <th>Started</th>
        <th>Ended</th>
        <th>Started (UTC)</th>
        <th>Ended (UTC)</th>
        <th>Left</th>
        <th>Right</th>
        <th>Combined</th>
        <th>Gap since previous</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    /* ============================================================
       DATA - Stored sessions live here.
       ============================================================ */
    var DATA = {
      activeUserId: 'u1',
      users: [
        {
          id: 'u1',
          name: 'User 1',
          sessions: [
            ["u1", "User 1", "s_1791426197608_av1ctk", "2026-10-07", "2026-10-08T02:05:52.448Z", "2026-10-08T02:23:17.600Z", 449153, 534505, 983658, 1045152, "2026-10-08T02:23:17.658Z"],
            ["u1", "User 1", "s_1791404209144_f1hgk6", "2026-10-07", "2026-10-07T20:06:14.506Z", "2026-10-07T20:16:49.144Z", 278703, 297902, 576606, 634638, "2026-10-07T20:16:49.170Z"],
            ["u1", "User 1", "s_1791384176546_7aq7ez", "2026-10-07", "2026-10-07T14:35:54.002Z", "2026-10-07T14:42:56.545Z", 263552, 156184, 419736, 422543, "2026-10-07T14:42:56.582Z"],
            ["u1", "User 1", "s_1791338922725_fcn8y2", "2026-10-06", "2026-10-07T01:49:50.600Z", "2026-10-07T02:08:42.724Z", 486204, 486752, 972956, 1132124, "2026-10-07T02:08:42.751Z"],
            ["u1", "User 1", "s_1791316690983_bhx75e", "2026-10-06", "2026-10-06T19:50:54.777Z", "2026-10-06T19:58:10.971Z", 170601, 187201, 357802, 436194, "2026-10-06T19:58:11.008Z"],
            ["u1", "User 1", "s_1791297117532_yyk3at", "2026-10-06", "2026-10-06T14:25:38.196Z", "2026-10-06T14:31:57.520Z", 170053, 162251, 332304, 379324, "2026-10-06T14:31:57.553Z"],
            ["u1", "User 1", "s_1791252964483_v29ii3", "2026-10-05", "2026-10-06T01:58:52.221Z", "2026-10-06T02:16:04.471Z", 343410, 488653, 832063, 1032250, "2026-10-06T02:16:04.537Z"],
            ["u1", "User 1", "s_1791232558308_nss0k7", "2026-10-05", "2026-10-05T20:26:12.443Z", "2026-10-05T20:35:58.305Z", 225877, 274252, 500128, 585862, "2026-10-05T20:35:58.352Z"],
            ["u1", "User 1", "s_1791210860160_keawbh", "2026-10-05", "2026-10-05T14:23:53.037Z", "2026-10-05T14:34:20.149Z", 238504, 290051, 528555, 627112, "2026-10-05T14:34:20.171Z"],
            ["u1", "User 1", "s_1791167480747_33yv6s", "2026-10-04", "2026-10-05T02:13:41.921Z", "2026-10-05T02:31:20.734Z", 554775, 431702, 986477, 1058813, "2026-10-05T02:31:20.749Z"],
            ["u1", "User 1", "s_1791125974715_z99sne", "2026-10-04", "2026-10-04T14:59:34.716Z", "2026-10-04T15:06:42.838Z", 208198, 160129, 368327, 428122, "2026-10-04T15:06:48.118Z"],
            ["u1", "User 1", "s_1791145337294_0uz80j", "2026-10-04", "2026-10-04T20:22:17.294Z", "2026-10-04T20:34:58.364Z", 327123, 384177, 711300, 761070, "2026-10-04T20:35:06.126Z"]
          ]
        },
        { id: 'u2', name: 'User 2', sessions: [] }
      ]
    };

    (function () {
      'use strict';

      var LS_KEY = 'dualTimer.store.v1';
      var store = { users: JSON.parse(JSON.stringify(DATA.users)) };
      var activeUserId = DATA.activeUserId;

      // Normalizer: Handles both legacy 11-element arrays and structured session objects
      function normalizeSession(s) {
        if (Array.isArray(s)) {
          return {
            id: s[2],
            date: s[3],
            started: s[4] ? String(s[4]).replace(/\s+/g, '') : '',
            ended: s[5] ? String(s[5]).replace(/\s+/g, '') : '',
            left: Number(s[6]) || 0,
            right: Number(s[7]) || 0,
            combined: Number(s[8]) || 0,
            total: Number(s[9]) || 0,
            savedAt: s[10] ? String(s[10]).replace(/\s+/g, '') : ''
          };
        }
        return {
          id: s.id || ('s_' + Date.now()),
          date: s.date || '',
          started: (s.started || s.start || '').replace(/\s+/g, ''),
          ended: (s.ended || s.end || '').replace(/\s+/g, ''),
          left: Number(s.left) || 0,
          right: Number(s.right) || 0,
          combined: Number(s.combined) || ((Number(s.left) || 0) + (Number(s.right) || 0)),
          total: Number(s.total) || 0,
          savedAt: (s.savedAt || '').replace(/\s+/g, '')
        };
      }

      function user() {
        var found = store.users.find(function (u) { return u.id === activeUserId; });
        if (found && found.sessions) {
          found.sessions = found.sessions.map(normalizeSession);
        }
        return found;
      }

      function snapshot() {
        return { activeUserId: activeUserId, users: store.users };
      }

      function persist() {
        DATA = snapshot();
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(DATA));
        } catch (e) {
          console.warn('save failed', e);
        }
        fetch('/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(DATA)
        }).catch(function () { /* localStorage only fallback */ });
      }

      function apply(data) {
        if (!data || !Array.isArray(data.users) || !data.users.length) return false;

        data.users.forEach(function (incomingUser) {
          var targetUser = store.users.find(function (u) { return u.id === incomingUser.id; });
          if (!targetUser) {
            store.users.push(incomingUser);
            targetUser = incomingUser;
          }
          var combinedSessions = (targetUser.sessions || []).concat(incomingUser.sessions || []);
          var uniqueMap = {};
          combinedSessions.forEach(function (s) {
            var clean = normalizeSession(s);
            if (clean && clean.id) uniqueMap[clean.id] = clean;
          });
          targetUser.sessions = Object.values(uniqueMap);
        });

        activeUserId = data.users.some(function (u) { return u.id === data.activeUserId; })
          ? data.activeUserId : data.users[0].id;
        return true;
      }

      function loadLocal() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (raw) apply(JSON.parse(raw));
        } catch (e) {
          console.warn('localStorage load failed', e);
        }
      }

      // Time and Date formatting
      function formatTime(ms) {
        if (!ms && ms !== 0) return '00:00:00.0';
        var secs = Math.floor(ms / 1000);
        var hrs = Math.floor(secs / 3600);
        var mins = Math.floor((secs % 3600) / 60);
        var remSecs = secs % 60;
        var tenths = Math.floor((ms % 1000) / 100);
        return [
          hrs.toString().padStart(2, '0'),
          mins.toString().padStart(2, '0'),
          remSecs.toString().padStart(2, '0')
        ].join(':') + '.' + tenths;
      }

      function formatDate(d) {
        return d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');
      }

      /* ============================================================
         TIMER STATE & DUAL ENGINE
         ============================================================ */
      var timerState = {
        activeTimer: null, // 'left', 'right', or null
        sessionStartTime: null,
        leftMs: 0,
        rightMs: 0,
        lastTick: null,
        timerInterval: null
      };

      var leftBox = document.getElementById('leftBox');
      var rightBox = document.getElementById('rightBox');
      var leftClock = document.getElementById('leftClock');
      var rightClock = document.getElementById('rightClock');
      var sessionInfo = document.getElementById('sessionInfo');

      function updateClockDisplays() {
        leftClock.textContent = formatTime(timerState.leftMs);
        rightClock.textContent = formatTime(timerState.rightMs);
      }

      function tick() {
        var now = performance.now();
        var delta = now - timerState.lastTick;
        timerState.lastTick = now;

        if (timerState.activeTimer === 'left') {
          timerState.leftMs += delta;
        } else if (timerState.activeTimer === 'right') {
          timerState.rightMs += delta;
        }

        updateClockDisplays();
      }

      function toggleTimer(side) {
        var now = performance.now();

        if (!timerState.sessionStartTime) {
          timerState.sessionStartTime = new Date();
          sessionInfo.textContent = 'Running (Started ' + timerState.sessionStartTime.toLocaleTimeString() + ')';
        }

        if (timerState.activeTimer === side) {
          // Pause when clicking currently running timer
          timerState.activeTimer = null;
          clearInterval(timerState.timerInterval);
          timerState.timerInterval = null;
          leftBox.classList.remove('active');
          rightBox.classList.remove('active');
        } else {
          // Switch or Start selected timer
          timerState.activeTimer = side;
          timerState.lastTick = now;
          if (!timerState.timerInterval) {
            timerState.timerInterval = setInterval(tick, 50);
          }
          leftBox.classList.toggle('active', side === 'left');
          rightBox.classList.toggle('active', side === 'right');
        }
      }

      document.getElementById('leftBtn').addEventListener('click', function () {
        toggleTimer('left');
      });

      document.getElementById('rightBtn').addEventListener('click', function () {
        toggleTimer('right');
      });

      function resetCurrentSession() {

        var userConfirmed = confirm("Are you sure you want to clear this session? Your current progress will be lost.");

        if (userConfirmed) {
          if (timerState.timerInterval) {
            clearInterval(timerState.timerInterval);
            timerState.timerInterval = null;
          }
          timerState.activeTimer = null;
          timerState.sessionStartTime = null;
          timerState.leftMs = 0;
          timerState.rightMs = 0;
          timerState.lastTick = null;
          leftBox.classList.remove('active');
          rightBox.classList.remove('active');
          updateClockDisplays();
          sessionInfo.textContent = 'not started';
        }
      }

      document.getElementById('resetBtn').addEventListener('click', resetCurrentSession);

      document.getElementById('saveBtn').addEventListener('click', function () {
        if (!timerState.sessionStartTime && timerState.leftMs === 0 && timerState.rightMs === 0) {
          alert('No recorded session to save.');
          return;
        }

        var endedAt = new Date();
        var startedAt = timerState.sessionStartTime || endedAt;
        var currentUser = user();

        var newSession = {
          id: 's_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
          date: formatDate(startedAt),
          started: startedAt.toISOString(),
          ended: endedAt.toISOString(),
          left: Math.round(timerState.leftMs),
          right: Math.round(timerState.rightMs),
          combined: Math.round(timerState.leftMs + timerState.rightMs),
          total: Math.round(endedAt - startedAt),
          savedAt: new Date().toISOString()
        };

        currentUser.sessions.unshift(newSession);
        persist();
        renderTable();
        if (timerState.timerInterval) {
          clearInterval(timerState.timerInterval);
          timerState.timerInterval = null;
        }
        timerState.activeTimer = null;
        timerState.sessionStartTime = null;
        timerState.leftMs = 0;
        timerState.rightMs = 0;
        timerState.lastTick = null;
        leftBox.classList.remove('active');
        rightBox.classList.remove('active');
        updateClockDisplays();
        sessionInfo.textContent = 'not started';
      });

      /* ============================================================
         RENDERING & TABLE CONTROLS
         ============================================================ */
      function renderTable() {
        var currentUser = user();
        var tbody = document.querySelector('#tbl tbody');
        var countSpan = document.getElementById('count');
        if (!tbody) return;

        tbody.innerHTML = '';
        if (!currentUser || !currentUser.sessions || !currentUser.sessions.length) {
          countSpan.textContent = '0';
          return;
        }

        var sorted = currentUser.sessions.slice().sort(function (a, b) {
          return new Date(b.started) - new Date(a.started);
        });

        countSpan.textContent = sorted.length;

        sorted.forEach(function (s, index) {
          var tr = document.createElement('tr');
          var startDate = new Date(s.started);
          var endDate = new Date(s.ended);

          var gapText = '-';
          if (index < sorted.length - 1) {
            var prevSession = sorted[index + 1];
            var gapMs = new Date(s.started) - new Date(prevSession.ended);
            if (gapMs > 0) gapText = formatTime(gapMs);
          }

          tr.innerHTML = [
            '<td>' + (isNaN(startDate.getTime()) ? '-' : startDate.toLocaleString()) + '</td>',
            '<td>' + (isNaN(endDate.getTime()) ? '-' : endDate.toLocaleString()) + '</td>',
            '<td>' + s.started + '</td>',
            '<td>' + s.ended + '</td>',
            '<td>' + formatTime(s.left) + '</td>',
            '<td>' + formatTime(s.right) + '</td>',
            '<td>' + formatTime(s.combined) + '</td>',
            '<td>' + gapText + '</td>',
            '<td><button class="del-btn" data-id="' + s.id + '">Delete</button></td>'
          ].join('');

          tbody.appendChild(tr);
        });
      }

      function render() {
        var currentUser = user();
        if (currentUser) {
          document.getElementById('userLabel').textContent = currentUser.name;
        }
      }

      window.copyDataSnippet = function () {
        var text = 'var DATA = ' + JSON.stringify(snapshot(), null, 2) + ';';
        if (navigator.clipboard) navigator.clipboard.writeText(text);
        return text;
      };

      // Export CSV functionality
      document.getElementById('exportCsvBtn').addEventListener('click', function () {
        var currentUser = user();
        if (!currentUser || !currentUser.sessions || !currentUser.sessions.length) {
          alert('No sessions to export.');
          return;
        }
        var headers = ['ID', 'Date', 'Started', 'Ended', 'Left (ms)', 'Right (ms)', 'Combined (ms)', 'Total (ms)', 'Saved At'];
        var rows = currentUser.sessions.map(function (s) {
          return [
            '"' + s.id + '"',
            '"' + s.date + '"',
            '"' + s.started + '"',
            '"' + s.ended + '"',
            s.left,
            s.right,
            s.combined,
            s.total,
            '"' + s.savedAt + '"'
          ].join(',');
        });
        var csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(',')].concat(rows).join('\n');
        var encodedUri = encodeURI(csvContent);
        var link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', 'sessions_' + currentUser.id + new Date() + '.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      // Table Row Delete Handler
      document.querySelector('#tbl tbody').addEventListener('click', function (e) {
        if (e.target.classList.contains('del-btn')) {
          var targetId = e.target.getAttribute('data-id');
          var currentUser = user();
          if (currentUser && currentUser.sessions) {
            currentUser.sessions = currentUser.sessions.filter(function (s) {
              return s.id !== targetId;
            });
            persist();
            renderTable();
          }
        }
      });

      // Dark Mode toggle
      var themeBtn = document.getElementById('themeBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var target = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', target);
          themeBtn.textContent = target === 'dark' ? 'Light mode' : 'Dark mode';
        });
      }

      // Collapsible sessions table
      document.getElementById('sessionsToggle').addEventListener('click', function () {
        var caret = document.getElementById('caret');
        var tbl = document.getElementById('tbl');
        var isClosed = caret.classList.toggle('closed');
        tbl.style.display = isClosed ? 'none' : '';
      });

      // Initial Load
      apply(DATA);
      loadLocal();
      render();
      renderTable();

    })();
  </script>
</body>

</html>
